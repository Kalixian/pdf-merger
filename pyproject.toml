[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-merger"
version = "0.1.0"
description = "A simple desktop tool for collating and combining PDF files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.gui-scripts]
pdf-merger = "pdf_merger.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
